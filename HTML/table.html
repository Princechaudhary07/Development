<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>A</td>
                <td rowspan="3">1</td>
            </tr>
            <tr>
                <td>B</td>
                <td>1</td>
            </tr>
            <tr>
                <td>C</td>
                <td>1</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>total</td>
                <td colspan="1">2</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
