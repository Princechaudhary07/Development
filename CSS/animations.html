<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation</title>
  <style>
    .btn {
      background: lightblue;
      color: black;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      animation: pulse 2s infinite; /* apply animation */
    }

    /* Keyframes define the animation steps */
    @keyframes pulse {
      0% {
        transform: scale(1);
        background: lightblue;
      }
      50% {
        transform: scale(1.2);
        background: darkblue;
        color: white;
      }
      100% {
        transform: scale(1);
        background: lightblue;
        color: black;
      }
    }
  </style>
</head>
<body>
  <button class="btn">Hover me</button>
</body>
</html>
