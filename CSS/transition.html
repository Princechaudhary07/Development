<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .btn {
          background: lightblue;
          color: black;
          padding: 10px 20px;
          border: none;
          transition: background 0.5s ease, color 0.5s ease;
}

        .btn:hover {
           background: darkblue;
           color: white;
}


    </style>
</head>
<body>
      <button class="btn">Hover me</button>

    
</body>
</html>
